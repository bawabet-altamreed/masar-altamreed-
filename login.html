<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | مسار التمريض</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;

            background:
                radial-gradient(circle at top right, #dff5ff 0%, transparent 35%),
                radial-gradient(circle at bottom left, #e8e3ff 0%, transparent 35%),
                #f6f8fc;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 14px;

            border-radius: 24px;

            background: linear-gradient(145deg, #1769aa, #0d3f68);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 15px 35px rgba(23, 105, 170, 0.22);
        }

        .brand h1 {
            color: #12395b;
            font-size: 27px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #7b8798;
            font-size: 14px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #e6ebf2;

            border-radius: 25px;

            padding: 28px 22px;

            box-shadow:
                0 20px 55px rgba(20, 45, 75, 0.10);
        }

        .welcome {
            margin-bottom: 23px;
        }

        .welcome h2 {
            color: #172033;
            font-size: 21px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #7b8798;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            color: #344054;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box .icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            height: 54px;

            border: 1px solid #dce3ec;
            border-radius: 14px;

            background: #f9fbfd;

            padding: 0 47px 0 14px;

            outline: none;

            color: #172033;
            font-size: 15px;

            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #1769aa;
            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(23, 105, 170, 0.08);
        }

        .login-btn {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 14px;

            background:
                linear-gradient(135deg, #1769aa, #0d4f80);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 7px;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;
            line-height: 1.7;

            text-align: center;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
            border: 1px solid #ffd4d4;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #087443;
            border: 1px solid #c7f0d8;
        }

        .contact-box {
            margin-top: 20px;

            padding: 15px;

            border-radius: 14px;

            background: #f5f9fc;

            text-align: center;
        }

        .contact-box p {
            color: #667085;
            font-size: 13px;
            line-height: 1.8;
        }

        .whatsapp {
            display: inline-block;

            margin-top: 5px;

            color: #128c55;

            font-weight: bold;

            text-decoration: none;
        }

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #98a2b3;

            font-size: 12px;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 24px 18px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="brand">

        <div class="logo">
            🩺
        </div>

        <h1>
            مسار التمريض
        </h1>

        <p>
            Masar Al-Tamreed
        </p>

    </div>


    <div class="login-card">

        <div class="welcome">

            <h2>
                تسجيل الدخول
            </h2>

            <p>
                أدخل كود الاشتراك وكلمة المرور للمتابعة
            </p>

        </div>


        <form id="loginForm">

            <div class="input-group">

                <label class="input-label" for="code">
                    كود الاشتراك
                </label>

                <div class="input-box">

                    <span class="icon">
                        🔑
                    </span>

                    <input
                        type="text"
                        id="code"
                        placeholder="مثال: ST001"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <div class="input-group">

                <label class="input-label" for="password">
                    كلمة المرور
                </label>

                <div class="input-box">

                    <span class="icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                تسجيل الدخول
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="contact-box">

            <p>
                إذا لم يكن لديك كود اشتراك،
                تواصل مع إدارة مسار التمريض.
            </p>

            <a
                class="whatsapp"
                href="https://wa.me/201222736904"
                target="_blank"
                rel="noopener"
            >
                واتساب الإدارة: 01222736904
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 مسار التمريض | Masar Al-Tamreed
    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./src/firebase/config.js";

import {
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const form =
    document.getElementById("loginForm");

const codeInput =
    document.getElementById("code");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage() {

    message.textContent = "";

    message.className = "message";

}


function isExpired(endDate) {

    if (!endDate) {
        return false;
    }

    const today = new Date();

    const end = new Date(
        endDate + "T23:59:59"
    );

    return today > end;

}


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const code =
        codeInput.value
            .trim()
            .toUpperCase();

    const password =
        passwordInput.value.trim();


    if (!code || !password) {

        showMessage(
            "من فضلك أدخل كود الاشتراك وكلمة المرور."
        );

        return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "جاري التحقق...";


    try {

        /*
         * =====================================
         * 1 - Anonymous Authentication
         * =====================================
         */

        if (!auth.currentUser) {

            await signInAnonymously(auth);

        }


        const uid =
            auth.currentUser.uid;


        console.log(
            "Student Anonymous UID:",
            uid
        );


        /*
         * =====================================
         * 2 - قراءة الاشتراك
         * subscriptions/{CODE}
         * =====================================
         */

        const subscriptionRef =
            doc(
                db,
                "subscriptions",
                code
            );


        const subscriptionSnapshot =
            await getDoc(subscriptionRef);


        if (!subscriptionSnapshot.exists()) {

            showMessage(
                "كود الاشتراك غير صحيح."
            );

            return;
        }


        const subscription =
            subscriptionSnapshot.data();


        console.log(
            "Subscription:",
            subscription
        );


        /*
         * =====================================
         * 3 - كلمة المرور
         * =====================================
         */

        if (
            String(subscription.password || "") !==
            password
        ) {

            showMessage(
                "كلمة المرور غير صحيحة."
            );

            return;
        }


        /*
         * =====================================
         * 4 - حالة الاشتراك
         * =====================================
         */

        if (
            String(subscription.status || "")
                .toLowerCase() !== "active"
        ) {

            showMessage(
                "هذا الاشتراك غير فعال حاليًا."
            );

            return;
        }


        /*
         * =====================================
         * 5 - تاريخ الانتهاء
         * =====================================
         */

        if (
            isExpired(subscription.endDate)
        ) {

            showMessage(
                "انتهى اشتراكك. يرجى التواصل مع الإدارة."
            );

            return;
        }


        /*
         * =====================================
         * 6 - Student ID
         * =====================================
         */

        const studentId =
            subscription.studentId || code;


        /*
         * =====================================
         * 7 - قراءة الطالب
         * =====================================
         */

        const studentRef =
            doc(
                db,
                "students",
                studentId
            );


        const studentSnapshot =
            await getDoc(studentRef);


        if (!studentSnapshot.exists()) {

            showMessage(
                "تم العثور على الاشتراك ولكن بيانات الطالب غير موجودة."
            );

            return;
        }


        const student =
            studentSnapshot.data();


        console.log(
            "Student:",
            student
        );


        /*
         * =====================================
         * 8 - الطالب موقوف؟
         * =====================================
         */

        if (
            student.isActive === false
        ) {

            showMessage(
                "حساب الطالب موقوف حاليًا."
            );

            return;
        }


        /*
         * =====================================
         * 9 - إنشاء / تحديث users/{uid}
         * =====================================
         */

        const userRef =
            doc(
                db,
                "users",
                uid
            );


        await setDoc(
            userRef,
            {

                uid: uid,

                role: "student",

                studentId: studentId,

                subscriptionCode: code,

                name:
                    student.name ||
                    subscription.name ||
                    "طالب",

                stage:
                    student.stage ||
                    subscription.stage ||
                    "",

                isActive: true,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge: true
            }
        );


        /*
         * =====================================
         * 10 - نجاح
         * =====================================
         */

        showMessage(
            `مرحبًا ${student.name || "بك"} 👋`,
            "success"
        );


        /*
         * =====================================
         * 11 - الانتقال للطالب
         * =====================================
         */

        setTimeout(() => {

            window.location.replace(
                "./student/dashboard.html"
            );

        }, 600);


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        let errorMessage =
            "حدث خطأ أثناء تسجيل الدخول.";


        if (
            error.code ===
            "permission-denied"
        ) {

            errorMessage =
                "ليس لديك صلاحية للوصول إلى بيانات الاشتراك.";

        }


        showMessage(
            errorMessage
        );


    } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
            "تسجيل الدخول";

    }

});

</script>

</body>

</html>

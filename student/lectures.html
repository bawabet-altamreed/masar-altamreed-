<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>المحاضرات | مسار التمريض</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5eaf0;
padding:15px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
color:#12395b;
}

.back{
text-decoration:none;
background:#eef6ff;
color:#1769aa;
padding:9px 13px;
border-radius:10px;
font-size:12px;
font-weight:bold;
}

main{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

h1{
margin-bottom:7px;
}

.subtitle{
font-size:13px;
color:#7b8798;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border:1px solid #e5eaf0;
border-radius:17px;
padding:19px;
}

.type{
font-size:11px;
color:#1769aa;
font-weight:bold;
}

.title{
font-size:17px;
font-weight:bold;
margin:8px 0;
}

.info{
font-size:12px;
color:#7b8798;
line-height:1.8;
}

.btn{
display:inline-block;
margin-top:13px;
padding:9px 13px;
border-radius:9px;
background:#1769aa;
color:white;
text-decoration:none;
font-size:12px;
font-weight:bold;
}

.empty{
background:white;
padding:45px;
border-radius:15px;
text-align:center;
color:#98a2b3;
}

@media(max-width:650px){
.grid{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
مسار التمريض
</div>

<a href="dashboard.html"
class="back">
← لوحة الطالب
</a>

</div>

</header>

<main>

<h1>🎥 المحاضرات</h1>

<p class="subtitle"
id="stageText">
جاري التحميل...
</p>

<div id="lectures"
class="grid">

<div class="empty">
جاري تحميل المحاضرات...
</div>

</div>

</main>

<script type="module"
src="./js/lectures.js">
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>الترتيب | مسار التمريض</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial;
background:#f5f7fb;
color:#172033;
}

header{
background:white;
border-bottom:1px solid #e5eaf0;
padding:15px;
}

.header{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
color:#12395b;
}

.back{
text-decoration:none;
background:#eef6ff;
color:#1769aa;
padding:9px 13px;
border-radius:10px;
font-size:12px;
}

main{
max-width:900px;
margin:auto;
padding:25px 15px;
}

.subtitle{
font-size:13px;
color:#7b8798;
margin-bottom:20px;
}

.table{
background:white;
border:1px solid #e5eaf0;
border-radius:17px;
overflow:hidden;
}

.row{
display:grid;
grid-template-columns:70px 1fr 100px;
padding:15px;
border-bottom:1px solid #edf0f4;
align-items:center;
font-size:13px;
}

.row:last-child{
border-bottom:0;
}

.head{
background:#f7f9fc;
font-size:11px;
font-weight:bold;
color:#667085;
}

.rank{
font-weight:bold;
color:#1769aa;
}

.score{
font-weight:bold;
}

.empty{
padding:45px;
text-align:center;
color:#98a2b3;
}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
مسار التمريض
</div>

<a href="dashboard.html"
class="back">
← لوحة الطالب
</a>

</div>

</header>

<main>

<h1>🏆 الترتيب</h1>

<p id="stageText"
class="subtitle">
جاري تحميل الترتيب...
</p>

<div class="table">

<div class="row head">
<div>المركز</div>
<div>الطالب</div>
<div>النقاط</div>
</div>

<div id="leaderboard">

<div class="empty">
جاري التحميل...
</div>

</div>

</div>

</main>

<script type="module"
src="./js/leaderboard.js">
</script>

</body>
</html>

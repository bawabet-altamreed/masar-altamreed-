<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>الجدول | مسار التمريض</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial;
background:#f5f7fb;
color:#172033;
}

header{
background:white;
border-bottom:1px solid #e5eaf0;
padding:15px;
}

.header{
max-width:1050px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
color:#12395b;
}

.back{
text-decoration:none;
background:#eef6ff;
color:#1769aa;
padding:9px 13px;
border-radius:10px;
font-size:12px;
font-weight:bold;
}

main{
max-width:1050px;
margin:auto;
padding:25px 15px;
}

h1{
font-size:24px;
margin-bottom:7px;
}

.subtitle{
color:#7b8798;
font-size:13px;
margin-bottom:20px;
}

.schedule{
display:grid;
gap:12px;
}

.item{
background:white;
border:1px solid #e5eaf0;
border-radius:15px;
padding:17px;
}

.day{
font-size:11px;
color:#1769aa;
font-weight:bold;
}

.subject{
font-size:16px;
font-weight:bold;
margin:6px 0;
}

.details{
font-size:12px;
color:#7b8798;
line-height:1.8;
}

.live{
display:inline-block;
background:#eaf8f0;
color:#087443;
padding:4px 8px;
border-radius:20px;
font-size:10px;
font-weight:bold;
margin-top:8px;
}

.empty{
background:white;
border-radius:15px;
padding:40px;
text-align:center;
color:#98a2b3;
}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
مسار التمريض
</div>

<a href="dashboard.html"
class="back">
← لوحة الطالب
</a>

</div>

</header>

<main>

<h1>📅 جدول المحاضرات</h1>

<p class="subtitle"
id="stageText">
جاري تحميل المرحلة...
</p>

<div id="schedule"
class="schedule">

<div class="empty">
جاري تحميل الجدول...
</div>

</div>

</main>

<script type="module"
src="./js/schedule.js">
</script>

</body>
</html>

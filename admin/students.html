<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة الطلاب | مسار التمريض</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

.topbar{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e7ebf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:13px;
    background:linear-gradient(135deg,#1769aa,#0d3f68);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.brand h1{
    font-size:19px;
    color:#12395b;
}

.brand span{
    display:block;
    color:#98a2b3;
    font-size:11px;
}

.back{
    text-decoration:none;
    color:#1769aa;
    background:#eef6ff;
    padding:10px 14px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:25px;
}

.title{
    margin-bottom:20px;
}

.title h2{
    font-size:25px;
    margin-bottom:7px;
}

.title p{
    color:#7b8798;
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:370px 1fr;
    gap:20px;
}

.card{
    background:#fff;
    border:1px solid #e5eaf0;
    border-radius:18px;
    padding:21px;
    box-shadow:0 5px 20px rgba(20,45,75,.04);
}

.card h3{
    margin-bottom:18px;
}

.form-group{
    margin-bottom:14px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input,select{
    width:100%;
    height:45px;
    border:1px solid #dce3ec;
    border-radius:11px;
    background:#fafbfd;
    padding:0 12px;
    outline:none;
    font-family:inherit;
}

input:focus,
select:focus{
    border-color:#1769aa;
    background:#fff;
}

.stages{
    display:grid;
    gap:7px;
}

.stage{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px;
    background:#f8fafc;
    border-radius:9px;
    font-size:12px;
}

.stage input{
    width:17px;
    height:17px;
}

.btn{
    width:100%;
    height:47px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#1769aa,#0d4f80);
    color:#fff;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:11px;
    border-radius:10px;
    margin-bottom:14px;
    font-size:12px;
    text-align:center;
}

.message.success{
    display:block;
    background:#ecfdf3;
    color:#087443;
}

.message.error{
    display:block;
    background:#fff1f1;
    color:#b42318;
}

.search{
    width:100%;
    height:45px;
    margin-bottom:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

th{
    background:#f7f9fc;
    color:#667085;
    font-size:11px;
    padding:12px;
    text-align:right;
}

td{
    padding:12px;
    border-bottom:1px solid #edf0f4;
    font-size:12px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
    margin:2px;
}

.active{
    background:#eaf8f0;
    color:#087443;
}

.inactive{
    background:#fff1f1;
    color:#b42318;
}

.action{
    border:0;
    padding:7px 9px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
    margin:2px;
}

.toggle{
    background:#eef6ff;
    color:#1769aa;
}

.delete{
    background:#fff1f1;
    color:#b42318;
}

.empty{
    text-align:center;
    padding:40px;
    color:#98a2b3;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

    .topbar{
        padding:0 12px;
    }

    .brand span{
        display:none;
    }

    .card{
        padding:16px;
    }

}

</style>

</head>

<body>

<header class="topbar">

<div class="brand">

<div class="logo">🩺</div>

<div>
<h1>مسار التمريض</h1>
<span>Masar Al-Tamreed</span>
</div>

</div>

<a href="dashboard.html" class="back">
← لوحة الإدارة
</a>

</header>


<main class="container">

<div class="title">

<h2>👨‍🎓 إدارة الطلاب</h2>

<p>
إضافة الطلاب وإدارة الاشتراكات والصلاحيات الدراسية
</p>

</div>


<div class="grid">


<section class="card">

<h3>➕ إضافة طالب</h3>

<div id="message" class="message"></div>

<form id="studentForm">


<div class="form-group">

<label>اسم الطالب</label>

<input
id="name"
type="text"
placeholder="مثال: أحمد محمد"
required
>

</div>


<div class="form-group">

<label>كود الطالب</label>

<input
id="studentId"
type="text"
placeholder="ST001"
required
>

</div>


<div class="form-group">

<label>كود الاشتراك</label>

<input
id="subscriptionCode"
type="text"
placeholder="SUB001"
required
>

</div>


<div class="form-group">

<label>كلمة المرور</label>

<input
id="password"
type="text"
placeholder="كلمة مرور الطالب"
required
>

</div>


<div class="form-group">

<label>المرحلة الدراسية</label>

<select id="stage" required>

<option value="">اختر المرحلة</option>

<option value="first_secondary_nursing">
الأول الثانوي التمريض
</option>

<option value="second_secondary_nursing">
الثاني الثانوي التمريض
</option>

<option value="third_secondary_nursing">
الثالث الثانوي التمريض
</option>

<option value="first_institute_nursing">
الأول معهد التمريض
</option>

<option value="second_institute_nursing">
الثاني معهد التمريض
</option>

</select>

</div>


<div class="form-group">

<label>بداية الاشتراك</label>

<input
id="startDate"
type="date"
required
>

</div>


<div class="form-group">

<label>نهاية الاشتراك</label>

<input
id="endDate"
type="date"
required
>

</div>


<button
id="saveBtn"
class="btn"
type="submit"
>

إضافة الطالب والاشتراك

</button>

</form>

</section>


<section class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:17px;
">

<h3 style="margin:0">
👨‍🎓 الطلاب
</h3>

<span id="count" style="
color:#98a2b3;
font-size:11px;
">
0 طالب
</span>

</div>


<input
id="search"
class="search"
type="search"
placeholder="🔍 ابحث باسم الطالب أو الكود..."
>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>الطالب</th>
<th>الكود</th>
<th>المرحلة</th>
<th>الاشتراك</th>
<th>الحالة</th>
<th>إجراء</th>

</tr>

</thead>

<tbody id="studentsTable">

<tr>
<td colspan="6" class="empty">
جاري تحميل الطلاب...
</td>
</tr>

</tbody>

</table>

</div>

</section>

</div>

</main>


<script type="module">

import {
    db
} from "../src/firebase/config.js";

import {
    collection,
    doc,
    getDocs,
    setDoc,
    deleteDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    protectAdminPage
} from "../src/firebase/admin-guard.js";


const form =
document.getElementById("studentForm");

const table =
document.getElementById("studentsTable");

const search =
document.getElementById("search");

const message =
document.getElementById("message");

const saveBtn =
document.getElementById("saveBtn");

const count =
document.getElementById("count");


let students=[];


const stages={

first_secondary_nursing:
"الأول الثانوي التمريض",

second_secondary_nursing:
"الثاني الثانوي التمريض",

third_secondary_nursing:
"الثالث الثانوي التمريض",

first_institute_nursing:
"الأول معهد التمريض",

second_institute_nursing:
"الثاني معهد التمريض"

};


function msg(text,type="error"){

message.textContent=text;
message.className="message "+type;

}


function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


async function loadStudents(){

const snapshot =
await getDocs(collection(db,"students"));

students =
snapshot.docs.map(item=>({

id:item.id,
data:item.data()

}));


render(students);

}


function render(list){

count.textContent =
`${list.length} طالب`;

if(!list.length){

table.innerHTML=`

<tr>
<td colspan="6" class="empty">
لا يوجد طلاب
</td>
</tr>

`;

return;

}


table.innerHTML=list.map(item=>{

const d=item.data;

return `

<tr>

<td>
<strong>
${escapeHtml(d.name || "بدون اسم")}
</strong>
</td>

<td>
${escapeHtml(item.id)}
</td>

<td>
${escapeHtml(stages[d.stage] || d.stage || "غير محددة")}
</td>

<td>
${escapeHtml(d.subscriptionCode || "—")}
</td>

<td>

<span class="badge ${
d.isActive === false
? "inactive"
: "active"
}">

${
d.isActive === false
? "موقوف"
: "فعال"
}

</span>

</td>

<td>

<button
class="action toggle"
data-id="${escapeHtml(item.id)}"
data-action="toggle"
>

${
d.isActive === false
? "تفعيل"
: "إيقاف"
}

</button>

<button
class="action delete"
data-id="${escapeHtml(item.id)}"
data-action="delete"
>

حذف

</button>

</td>

</tr>

`;

}).join("");


document
.querySelectorAll("[data-action]")
.forEach(btn=>{

btn.addEventListener("click",()=>{

if(btn.dataset.action==="toggle")
toggleStudent(btn.dataset.id);

if(btn.dataset.action==="delete")
deleteStudent(btn.dataset.id);

});

});

}


form.addEventListener("submit",async e=>{

e.preventDefault();

msg("");

const name=
document.getElementById("name").value.trim();

const studentId=
document.getElementById("studentId").value.trim().toUpperCase();

const subscriptionCode=
document.getElementById("subscriptionCode").value.trim().toUpperCase();

const password=
document.getElementById("password").value;

const stage=
document.getElementById("stage").value;

const startDate=
document.getElementById("startDate").value;

const endDate=
document.getElementById("endDate").value;


if(
!name ||
!studentId ||
!subscriptionCode ||
!password ||
!stage ||
!startDate ||
!endDate
){

msg("من فضلك أكمل جميع البيانات.");

return;

}


saveBtn.disabled=true;
saveBtn.textContent="جاري الحفظ...";


try{

await setDoc(
doc(db,"students",studentId),
{

name,
studentId,
stage,
subscriptionCode,

isActive:true,

createdAt:serverTimestamp(),
updatedAt:serverTimestamp()

}
);


await setDoc(
doc(db,"subscriptions",subscriptionCode),
{

studentId,

password,

startDate,

endDate,

status:"active",

createdAt:serverTimestamp(),
updatedAt:serverTimestamp()

}
);


msg(
"تم إنشاء الطالب والاشتراك بنجاح ✅",
"success"
);

form.reset();

await loadStudents();


}catch(error){

console.error(error);

msg(
"حدث خطأ أثناء الحفظ: "+error.message
);

}finally{

saveBtn.disabled=false;
saveBtn.textContent="إضافة الطالب والاشتراك";

}

});


async function toggleStudent(id){

const student=
students.find(x=>x.id===id);

if(!student)return;

await updateDoc(
doc(db,"students",id),
{

isActive:
student.data.isActive === false,

updatedAt:serverTimestamp()

}
);

await loadStudents();

}


async function deleteStudent(id){

if(!confirm("هل أنت متأكد من حذف الطالب؟"))
return;

const student=
students.find(x=>x.id===id);

try{

await deleteDoc(
doc(db,"students",id)
);


if(student?.data?.subscriptionCode){

await deleteDoc(
doc(
db,
"subscriptions",
student.data.subscriptionCode
)
);

}


msg("تم حذف الطالب والاشتراك.","success");

await loadStudents();

}catch(error){

console.error(error);

msg("تعذر حذف الطالب.");

}

}


search.addEventListener("input",()=>{

const value=
search.value.trim().toLowerCase();

if(!value){

render(students);
return;

}

render(
students.filter(item=>
String(item.data.name||"")
.toLowerCase()
.includes(value)
||
item.id.toLowerCase().includes(value)
)

);

});


protectAdminPage({

onAuthorized(){

loadStudents();

},

onUnauthorized(){

document.body.innerHTML=`

<div style="
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Tahoma;
text-align:center;
padding:20px;
">

<div>

<div style="font-size:50px">🔒</div>

<h2>غير مصرح بالدخول</h2>

<p style="color:#777">
هذه الصفحة مخصصة للإدارة فقط.
</p>

</div>

</div>

`;

}

});

</script>

</body>
</html>

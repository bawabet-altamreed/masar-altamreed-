<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المدرسين | مسار التمريض</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .topbar {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid #e6eaf0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: linear-gradient(135deg, #1769aa, #0d3f68);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .brand h1 {
            font-size: 18px;
            color: #12395b;
        }

        .brand span {
            display: block;
            color: #98a2b3;
            font-size: 10px;
            margin-top: 3px;
        }

        .back {
            text-decoration: none;
            color: #1769aa;
            background: #eef6ff;
            padding: 9px 13px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 25px;
        }

        .page-title {
            margin-bottom: 22px;
        }

        .page-title h2 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #7b8798;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: 370px 1fr;
            gap: 20px;
            align-items: start;
        }

        .card {
            background: #fff;
            border: 1px solid #e5eaf0;
            border-radius: 18px;
            padding: 21px;
            box-shadow: 0 5px 20px rgba(20,45,75,.04);
        }

        .card h3 {
            font-size: 17px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #344054;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 45px;
            border: 1px solid #dce3ec;
            border-radius: 11px;
            background: #fafbfd;
            padding: 0 12px;
            outline: none;
            font-family: inherit;
            color: #172033;
        }

        input:focus,
        select:focus {
            border-color: #1769aa;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(23,105,170,.08);
        }

        .permissions {
            display: grid;
            gap: 9px;
        }

        .permission {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .permission input {
            width: 17px;
            height: 17px;
        }

        .primary-btn {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg,#1769aa,#0d4f80);
            color: #fff;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .primary-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #087443;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
        }

        .toolbar {
            margin-bottom: 17px;
        }

        .search {
            width: 100%;
        }

        .teachers-list {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #f7f9fc;
            color: #667085;
            font-size: 11px;
            padding: 12px 9px;
            text-align: right;
        }

        td {
            padding: 13px 9px;
            border-bottom: 1px solid #edf0f4;
            font-size: 12px;
        }

        .teacher-name {
            font-weight: bold;
        }

        .teacher-code {
            color: #1769aa;
            font-family: monospace;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .enabled {
            background: #eaf8f0;
            color: #087443;
        }

        .disabled {
            background: #fff1f1;
            color: #b42318;
        }

        .permission-badge {
            background: #eef6ff;
            color: #1769aa;
            margin: 2px;
        }

        .action-btn {
            border: none;
            padding: 7px 9px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }

        .toggle-btn {
            background: #eef6ff;
            color: #1769aa;
        }

        .delete-btn {
            background: #fff1f1;
            color: #b42318;
        }

        .empty {
            text-align: center;
            padding: 45px 15px;
            color: #98a2b3;
            font-size: 13px;
        }

        .count {
            color: #98a2b3;
            font-size: 11px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px 11px;
            }

            .topbar {
                padding: 0 12px;
            }

            .brand span {
                display: none;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="logo">🩺</div>

        <div>
            <h1>مسار التمريض</h1>
            <span>Masar Al-Tamreed</span>
        </div>
    </div>

    <a href="dashboard.html" class="back">
        ← لوحة الإدارة
    </a>

</header>


<main class="container">

    <div class="page-title">
        <h2>إدارة المدرسين 👨‍🏫</h2>

        <p>
            إضافة المدرسين وتحديد صلاحياتهم داخل المنصة
        </p>
    </div>


    <div class="grid">

        <!-- إضافة مدرس -->

        <section class="card">

            <h3>➕ إضافة مدرس</h3>

            <div id="message" class="message"></div>

            <form id="teacherForm">

                <div class="form-group">

                    <label for="name">
                        اسم المدرس
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="مثال: د. أحمد محمد"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="code">
                        كود المدرس
                    </label>

                    <input
                        id="code"
                        type="text"
                        placeholder="مثال: TCH001"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stage">
                        المرحلة الأساسية
                    </label>

                    <select id="stage" required>

                        <option value="">
                            اختر المرحلة
                        </option>

                        <option value="first_secondary_nursing">
                            الأول الثانوي التمريض
                        </option>

                        <option value="second_secondary_nursing">
                            الثاني الثانوي التمريض
                        </option>

                        <option value="third_secondary_nursing">
                            الثالث الثانوي التمريض
                        </option>

                        <option value="first_institute_nursing">
                            الأول معهد التمريض
                        </option>

                        <option value="second_institute_nursing">
                            الثاني معهد التمريض
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        صلاحيات المدرس
                    </label>

                    <div class="permissions">

                        <label class="permission">
                            <input
                                type="checkbox"
                                value="lectures"
                                class="permission-input"
                            >
                            إدارة المحاضرات
                        </label>

                        <label class="permission">
                            <input
                                type="checkbox"
                                value="schedule"
                                class="permission-input"
                            >
                            إدارة الجدول
                        </label>

                        <label class="permission">
                            <input
                                type="checkbox"
                                value="students"
                                class="permission-input"
                            >
                            مشاهدة الطلاب
                        </label>

                        <label class="permission">
                            <input
                                type="checkbox"
                                value="exams"
                                class="permission-input"
                            >
                            إدارة الاختبارات
                        </label>

                        <label class="permission">
                            <input
                                type="checkbox"
                                value="files"
                                class="permission-input"
                            >
                            إدارة الملفات
                        </label>

                    </div>

                </div>


                <button
                    id="saveBtn"
                    class="primary-btn"
                    type="submit"
                >
                    إضافة المدرس
                </button>

            </form>

        </section>


        <!-- قائمة المدرسين -->

        <section class="card">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:17px;
            ">

                <h3 style="margin:0;">
                    👨‍🏫 المدرسون
                </h3>

                <span id="count" class="count">
                    0 مدرس
                </span>

            </div>


            <div class="toolbar">

                <input
                    id="search"
                    class="search"
                    type="search"
                    placeholder="🔍 ابحث باسم المدرس أو الكود..."
                >

            </div>


            <div class="teachers-list">

                <table>

                    <thead>

                        <tr>

                            <th>المدرس</th>
                            <th>الكود</th>
                            <th>المرحلة</th>
                            <th>الصلاحيات</th>
                            <th>الحالة</th>
                            <th>إجراء</th>

                        </tr>

                    </thead>

                    <tbody id="teachersTable">

                        <tr>
                            <td colspan="6" class="empty">
                                جاري تحميل المدرسين...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "../src/firebase/config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    doc,
    getDocs,
    setDoc,
    deleteDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ADMIN_UID =
    "nDhRZ5jHk4W03RLUyKvcDvc5sMy2";


const form =
    document.getElementById("teacherForm");

const table =
    document.getElementById("teachersTable");

const search =
    document.getElementById("search");

const message =
    document.getElementById("message");

const saveBtn =
    document.getElementById("saveBtn");

const count =
    document.getElementById("count");


let teachers = [];


const stageNames = {

    first_secondary_nursing:
        "الأول الثانوي التمريض",

    second_secondary_nursing:
        "الثاني الثانوي التمريض",

    third_secondary_nursing:
        "الثالث الثانوي التمريض",

    first_institute_nursing:
        "الأول معهد التمريض",

    second_institute_nursing:
        "الثاني معهد التمريض"

};


const permissionNames = {

    lectures: "المحاضرات",

    schedule: "الجدول",

    students: "الطلاب",

    exams: "الاختبارات",

    files: "الملفات"

};


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


function hideMessage() {

    message.textContent = "";

    message.className =
        "message";

}


function renderTeachers(list = teachers) {

    count.textContent =
        `${list.length} مدرس`;


    if (!list.length) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    لا يوجد مدرسون حاليًا
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        list.map(item => {

            const data =
                item.data;


            const permissions =
                Array.isArray(data.permissions)
                    ? data.permissions
                    : [];


            const permissionHTML =
                permissions.length
                    ? permissions.map(permission => `
                        <span class="badge permission-badge">
                            ${escapeHtml(
                                permissionNames[permission] || permission
                            )}
                        </span>
                    `).join("")
                    : "—";


            return `
                <tr>

                    <td>
                        <div class="teacher-name">
                            ${escapeHtml(data.name || "بدون اسم")}
                        </div>
                    </td>

                    <td>
                        <span class="teacher-code">
                            ${escapeHtml(item.id)}
                        </span>
                    </td>

                    <td>
                        ${escapeHtml(
                            stageNames[data.stage] || "غير محدد"
                        )}
                    </td>

                    <td>
                        ${permissionHTML}
                    </td>

                    <td>
                        <span class="badge ${
                            data.isActive === false
                                ? "disabled"
                                : "enabled"
                        }">
                            ${
                                data.isActive === false
                                    ? "موقوف"
                                    : "فعال"
                            }
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-btn toggle-btn"
                            data-action="toggle"
                            data-id="${escapeHtml(item.id)}"
                        >
                            ${
                                data.isActive === false
                                    ? "تفعيل"
                                    : "إيقاف"
                            }
                        </button>

                        <button
                            class="action-btn delete-btn"
                            data-action="delete"
                            data-id="${escapeHtml(item.id)}"
                        >
                            حذف
                        </button>

                    </td>

                </tr>
            `;

        }).join("");


    document
        .querySelectorAll("[data-action]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        button.dataset.id;

                    if (
                        button.dataset.action ===
                        "toggle"
                    ) {

                        toggleTeacher(id);

                    }

                    if (
                        button.dataset.action ===
                        "delete"
                    ) {

                        deleteTeacher(id);

                    }

                }
            );

        });

}


async function loadTeachers() {

    try {

        const snapshot =
            await getDocs(
                collection(db, "users")
            );


        teachers = snapshot.docs
            .map(item => ({

                id: item.id,

                data: item.data()

            }))
            .filter(item =>
                item.data.role === "teacher"
            );


        renderTeachers();

    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    تعذر تحميل المدرسين
                </td>
            </tr>
        `;

    }

}


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        hideMessage();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const code =
            document
                .getElementById("code")
                .value
                .trim()
                .toUpperCase();


        const stage =
            document
                .getElementById("stage")
                .value;


        const permissions =
            [...document.querySelectorAll(
                ".permission-input:checked"
            )]
            .map(input => input.value);


        if (
            !name ||
            !code ||
            !stage
        ) {

            showMessage(
                "من فضلك أكمل بيانات المدرس.",
                "error"
            );

            return;

        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            "جاري الحفظ...";


        try {

            /*
             * users/{teacherCode}
             *
             * لا ننشئ Firebase Auth account
             * من المتصفح هنا.
             *
             * سيتم ربط UID الحقيقي بالمدرس
             * عند تجهيز نظام دخول المدرسين.
             */

            await setDoc(
                doc(
                    db,
                    "users",
                    code
                ),
                {

                    name,

                    role:
                        "teacher",

                    stage,

                    permissions,

                    isActive:
                        true,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "تم إضافة المدرس بنجاح ✅",
                "success"
            );


            form.reset();

            await loadTeachers();


        } catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء إضافة المدرس: " +
                error.message,
                "error"
            );

        } finally {

            saveBtn.disabled = false;

            saveBtn.textContent =
                "إضافة المدرس";

        }

    }
);


search.addEventListener(
    "input",
    () => {

        const value =
            search.value
                .trim()
                .toLowerCase();


        if (!value) {

            renderTeachers();

            return;

        }


        const filtered =
            teachers.filter(item => {

                const name =
                    String(
                        item.data.name || ""
                    ).toLowerCase();


                const code =
                    item.id.toLowerCase();


                return (
                    name.includes(value) ||
                    code.includes(value)
                );

            });


        renderTeachers(filtered);

    }
);


async function toggleTeacher(id) {

    const teacher =
        teachers.find(
            item => item.id === id
        );


    if (!teacher) {
        return;
    }


    try {

        await updateDoc(
            doc(
                db,
                "users",
                id
            ),
            {

                isActive:
                    teacher.data.isActive === false,

                updatedAt:
                    serverTimestamp()

            }
        );


        await loadTeachers();

    } catch (error) {

        console.error(error);

        showMessage(
            "تعذر تغيير حالة المدرس.",
            "error"
        );

    }

}


async function deleteTeacher(id) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا المدرس؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "users",
                id
            )
        );


        showMessage(
            "تم حذف المدرس بنجاح.",
            "success"
        );


        await loadTeachers();

    } catch (error) {

        console.error(error);

        showMessage(
            "تعذر حذف المدرس.",
            "error"
        );

    }

}


onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "../login.html";

            return;

        }


        if (user.uid !== ADMIN_UID) {

            document.body.innerHTML = `
                <div style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    text-align:center;
                    font-family:Tahoma,Arial;
                    background:#f5f7fb;
                    padding:20px;
                ">

                    <div>

                        <div style="
                            font-size:50px;
                            margin-bottom:10px;
                        ">
                            🔒
                        </div>

                        <h2>
                            غير مصرح بالدخول
                        </h2>

                        <p style="
                            color:#777;
                            margin-top:10px;
                        ">
                            هذه الصفحة مخصصة لإدارة
                            مسار التمريض.
                        </p>

                    </div>

                </div>
            `;

            return;

        }


        await loadTeachers();

    }
);

</script>

</body>
</html>

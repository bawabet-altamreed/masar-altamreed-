<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة المدرسين | مسار التمريض</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

.topbar{
height:72px;
background:#fff;
border-bottom:1px solid #e7ebf2;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:44px;
height:44px;
border-radius:13px;
background:linear-gradient(135deg,#1769aa,#0d3f68);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.brand h1{
font-size:19px;
color:#12395b;
}

.brand span{
display:block;
color:#98a2b3;
font-size:11px;
}

.back{
text-decoration:none;
color:#1769aa;
background:#eef6ff;
padding:10px 14px;
border-radius:10px;
font-size:12px;
font-weight:bold;
}

.container{
max-width:1250px;
margin:auto;
padding:25px;
}

.title{
margin-bottom:20px;
}

.title h2{
font-size:25px;
margin-bottom:7px;
}

.title p{
color:#7b8798;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:370px 1fr;
gap:20px;
}

.card{
background:#fff;
border:1px solid #e5eaf0;
border-radius:18px;
padding:21px;
}

.form-group{
margin-bottom:14px;
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:7px;
color:#344054;
}

input{
width:100%;
height:45px;
border:1px solid #dce3ec;
border-radius:11px;
padding:0 12px;
font-family:inherit;
outline:none;
}

.stages{
display:grid;
gap:7px;
}

.stage{
display:flex;
align-items:center;
gap:8px;
background:#f8fafc;
padding:10px;
border-radius:9px;
font-size:12px;
}

.stage input{
width:17px;
height:17px;
}

.permissions{
display:grid;
gap:7px;
}

.permission{
display:flex;
align-items:center;
gap:8px;
background:#f8fafc;
padding:10px;
border-radius:9px;
font-size:12px;
}

.permission input{
width:17px;
height:17px;
}

.btn{
width:100%;
height:47px;
border:0;
border-radius:11px;
background:linear-gradient(135deg,#1769aa,#0d4f80);
color:#fff;
font-family:inherit;
font-weight:bold;
cursor:pointer;
}

.message{
display:none;
padding:11px;
border-radius:10px;
margin-bottom:14px;
font-size:12px;
text-align:center;
}

.message.success{
display:block;
background:#ecfdf3;
color:#087443;
}

.message.error{
display:block;
background:#fff1f1;
color:#b42318;
}

.search{
width:100%;
height:45px;
margin-bottom:15px;
border:1px solid #dce3ec;
border-radius:11px;
padding:0 12px;
font-family:inherit;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
min-width:850px;
border-collapse:collapse;
}

th{
background:#f7f9fc;
color:#667085;
font-size:11px;
padding:12px;
text-align:right;
}

td{
padding:12px;
border-bottom:1px solid #edf0f4;
font-size:12px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:10px;
font-weight:bold;
margin:2px;
background:#eef6ff;
color:#1769aa;
}

.active{
background:#eaf8f0;
color:#087443;
}

.inactive{
background:#fff1f1;
color:#b42318;
}

.action{
border:0;
padding:7px 9px;
border-radius:8px;
font-family:inherit;
font-size:11px;
cursor:pointer;
}

.toggle{
background:#eef6ff;
color:#1769aa;
}

.delete{
background:#fff1f1;
color:#b42318;
}

.empty{
text-align:center;
padding:40px;
color:#98a2b3;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header class="topbar">

<div class="brand">

<div class="logo">🩺</div>

<div>
<h1>مسار التمريض</h1>
<span>Masar Al-Tamreed</span>
</div>

</div>

<a href="dashboard.html" class="back">
← لوحة الإدارة
</a>

</header>


<main class="container">

<div class="title">

<h2>👨‍🏫 إدارة المدرسين</h2>

<p>
إضافة المدرسين وربطهم بالمراحل والصلاحيات
</p>

</div>


<div class="grid">


<section class="card">

<h3 style="margin-bottom:18px">
➕ إضافة مدرس
</h3>

<div id="message" class="message"></div>

<form id="teacherForm">


<div class="form-group">

<label>اسم المدرس</label>

<input
id="name"
placeholder="د. أحمد محمد"
required
>

</div>


<div class="form-group">

<label>كود المدرس</label>

<input
id="code"
placeholder="TCH001"
required
>

</div>


<div class="form-group">

<label>
المراحل التي يدرسها المدرس
</label>

<div class="stages">


<label class="stage">
<input type="checkbox" value="first_secondary_nursing">
الأول الثانوي التمريض
</label>

<label class="stage">
<input type="checkbox" value="second_secondary_nursing">
الثاني الثانوي التمريض
</label>

<label class="stage">
<input type="checkbox" value="third_secondary_nursing">
الثالث الثانوي التمريض
</label>

<label class="stage">
<input type="checkbox" value="first_institute_nursing">
الأول معهد التمريض
</label>

<label class="stage">
<input type="checkbox" value="second_institute_nursing">
الثاني معهد التمريض
</label>

</div>

</div>


<div class="form-group">

<label>
الصلاحيات
</label>

<div class="permissions">

<label class="permission">
<input type="checkbox" value="lectures">
إدارة المحاضرات
</label>

<label class="permission">
<input type="checkbox" value="schedule">
إدارة الجدول
</label>

<label class="permission">
<input type="checkbox" value="students">
مشاهدة الطلاب
</label>

<label class="permission">
<input type="checkbox" value="exams">
إدارة الاختبارات
</label>

<label class="permission">
<input type="checkbox" value="files">
إدارة الملفات
</label>

</div>

</div>


<button
id="saveBtn"
class="btn"
type="submit"
>

إضافة المدرس

</button>

</form>

</section>


<section class="card">

<div style="
display:flex;
justify-content:space-between;
margin-bottom:17px;
">

<h3>
👨‍🏫 المدرسون
</h3>

<span
id="count"
style="color:#98a2b3;font-size:11px"
>
0 مدرس
</span>

</div>


<input
id="search"
class="search"
placeholder="🔍 ابحث باسم المدرس أو الكود..."
>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>المدرس</th>
<th>الكود</th>
<th>المراحل</th>
<th>الصلاحيات</th>
<th>الحالة</th>
<th>إجراء</th>

</tr>

</thead>

<tbody id="teachersTable">

<tr>
<td colspan="6" class="empty">
جاري التحميل...
</td>
</tr>

</tbody>

</table>

</div>

</section>

</div>

</main>


<script type="module">

import {
db
} from "../src/firebase/config.js";

import {
collection,
doc,
getDocs,
setDoc,
deleteDoc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
protectAdminPage
} from "../src/firebase/admin-guard.js";


const form=document.getElementById("teacherForm");
const table=document.getElementById("teachersTable");
const search=document.getElementById("search");
const message=document.getElementById("message");
const saveBtn=document.getElementById("saveBtn");
const count=document.getElementById("count");

let teachers=[];


const stageNames={

first_secondary_nursing:"الأول الثانوي",
second_secondary_nursing:"الثاني الثانوي",
third_secondary_nursing:"الثالث الثانوي",
first_institute_nursing:"الأول معهد",
second_institute_nursing:"الثاني معهد"

};


const permissionNames={

lectures:"المحاضرات",
schedule:"الجدول",
students:"الطلاب",
exams:"الاختبارات",
files:"الملفات"

};


function escapeHtml(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function msg(text,type="error"){

message.textContent=text;
message.className="message "+type;

}


async function load(){

const snapshot=
await getDocs(collection(db,"users"));

teachers=
snapshot.docs
.map(x=>({id:x.id,data:x.data()}))
.filter(x=>x.data.role==="teacher");

render(teachers);

}


function render(list){

count.textContent=`${list.length} مدرس`;

if(!list.length){

table.innerHTML=`
<tr>
<td colspan="6" class="empty">
لا يوجد مدرسون
</td>
</tr>
`;

return;

}


table.innerHTML=list.map(item=>{

const d=item.data;

const stages=
Array.isArray(d.stages)
?d.stages
:(d.stage?[d.stage]:[]);

const permissions=
Array.isArray(d.permissions)
?d.permissions:[];


return `

<tr>

<td>
<strong>
${escapeHtml(d.name||"بدون اسم")}
</strong>
</td>

<td>
${escapeHtml(item.id)}
</td>

<td>

${
stages.map(s=>`
<span class="badge">
${escapeHtml(stageNames[s]||s)}
</span>
`).join("")
}

</td>

<td>

${
permissions.map(p=>`
<span class="badge">
${escapeHtml(permissionNames[p]||p)}
</span>
`).join("")
}

</td>

<td>

<span class="badge ${
d.isActive===false
?"inactive"
:"active"
}">

${
d.isActive===false
?"موقوف"
:"فعال"
}

</span>

</td>

<td>

<button
class="action toggle"
data-action="toggle"
data-id="${escapeHtml(item.id)}"
>

${
d.isActive===false
?"تفعيل"
:"إيقاف"
}

</button>

<button
class="action delete"
data-action="delete"
data-id="${escapeHtml(item.id)}"
>
حذف
</button>

</td>

</tr>

`;

}).join("");


document.querySelectorAll("[data-action]")
.forEach(btn=>{

btn.onclick=()=>{

if(btn.dataset.action==="toggle")
toggle(btn.dataset.id);

if(btn.dataset.action==="delete")
remove(btn.dataset.id);

};

});

}


form.addEventListener("submit",async e=>{

e.preventDefault();

const name=document.getElementById("name").value.trim();

const code=document.getElementById("code").value.trim().toUpperCase();


const stages=
[...document.querySelectorAll(".stage input:checked")]
.map(x=>x.value);


const permissions=
[...document.querySelectorAll(".permission input:checked")]
.map(x=>x.value);


if(!name||!code){

msg("أكمل بيانات المدرس.");
return;

}


if(!stages.length){

msg("اختر مرحلة واحدة على الأقل.");
return;

}


saveBtn.disabled=true;
saveBtn.textContent="جاري الحفظ...";


try{

await setDoc(
doc(db,"users",code),
{

name,
role:"teacher",

stages,

permissions,

isActive:true,

createdAt:serverTimestamp(),
updatedAt:serverTimestamp()

}
);


msg("تم إضافة المدرس بنجاح ✅","success");

form.reset();

await load();


}catch(error){

console.error(error);

msg("حدث خطأ: "+error.message);

}finally{

saveBtn.disabled=false;
saveBtn.textContent="إضافة المدرس";

}

});


async function toggle(id){

const teacher=
teachers.find(x=>x.id===id);

if(!teacher)return;

await updateDoc(
doc(db,"users",id),
{

isActive:
teacher.data.isActive===false,

updatedAt:serverTimestamp()

}
);

await load();

}


async function remove(id){

if(!confirm("هل تريد حذف المدرس؟"))
return;

await deleteDoc(
doc(db,"users",id)
);

await load();

}


search.addEventListener("input",()=>{

const value=
search.value.trim().toLowerCase();

if(!value){

render(teachers);
return;

}

render(
teachers.filter(x=>
String(x.data.name||"")
.toLowerCase()
.includes(value)
||
x.id.toLowerCase().includes(value)
)
);

});


protectAdminPage({

onAuthorized(){
load();
},

onUnauthorized(){
document.body.innerHTML=`
<div style="
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-family:Tahoma;
">
<div>
<div style="font-size:50px">🔒</div>
<h2>غير مصرح بالدخول</h2>
<p style="color:#777">
هذه الصفحة للإدارة فقط.
</p>
</div>
</div>
`;
}

});

</script>

</body>
</html>
